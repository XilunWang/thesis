<text x="285.0" y="469" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">不新增检测框或 RoI</text>
<text x="285.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">与 F 处于相同 stride 4 网格</text>
<rect x="660" y="400" width="480" height="170" rx="12" fill="#e7f0ff" stroke="#3975b5" stroke-width="2"/>
<text x="900.0" y="431" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#203047">D：门控细节残差补充</text>
<text x="900.0" y="469" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">局部变化 H + 语义门控 G</text>
<text x="900.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">F_D = F + 零初始化出口的残差</text>
<text x="900.0" y="531" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">关闭时直接使用原 F</text>
