<text x="900.0" y="1359" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">原 GT 与 M0 决定检查区域</text>
<text x="900.0" y="1390" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">从原 GT 取点，监督 M_ref</text>
