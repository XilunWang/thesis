<text x="900.0" y="709" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">mask_embed(q) 与 F_D 结合</text>
<text x="900.0" y="740" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">D 用于各层 mask，影响后续注意力</text>
