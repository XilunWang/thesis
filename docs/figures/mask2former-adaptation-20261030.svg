<text x="1515.0" y="709" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">不新增分类器或评分模块</text>
<text x="1515.0" y="740" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">联合训练仍可能影响类别判断</text>
