<text x="1515.0" y="919" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">同一 query 保持实例对应</text>
<text x="1515.0" y="950" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">一次细化，仍是 stride 4</text>
<text x="1515.0" y="981" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">无 RoI；不宣称新增真实分辨率</text>
<rect x="660" y="1090" width="480" height="120" rx="12" fill="#e7f5ed" stroke="#38875b" stroke-width="2"/>
