<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540">
<rect width="1800" height="1540" fill="#f7f9fc"/>
<text x="900" y="49" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#203047">面向 Mask2Former 的适配设计</text>
<text x="900" y="99" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#203047">2026-10-30 · 设计稿，尚未实现或验证收益 · 本轮不改模型、不训练</text>
<text x="900" y="145" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">白色：原有机制    蓝色：先验证 D    绿色：后续 R    橙色虚线：仅训练的 B</text>
<rect x="50" y="200" width="470" height="140" rx="12" fill="#ffffff" stroke="#8b99aa" stroke-width="2"/>
<text x="285.0" y="231" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#203047">水下图像 → ResNet-50</text>
<text x="285.0" y="269" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">C2：stride 4，浅层空间信息</text>
<text x="285.0" y="300" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">C3 / C4 / C5：高层特征</text>
<rect x="660" y="200" width="480" height="140" rx="12" fill="#ffffff" stroke="#8b99aa" stroke-width="2"/>
<text x="900.0" y="231" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#203047">原像素解码器</text>
<text x="900.0" y="269" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">6 层多尺度注意力 + 浅层融合</text>
<text x="900.0" y="300" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">输出共享 mask 特征 F 和 memory</text>
<rect x="1280" y="200" width="470" height="140" rx="12" fill="#ffffff" stroke="#8b99aa" stroke-width="2"/>
<text x="1515.0" y="231" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#203047">原 Transformer 解码器</text>
<text x="1515.0" y="269" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">9 层更新 100 个实例 query</text>
<text x="1515.0" y="300" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">每层按原逻辑预测 mask</text>
