<text x="1515.0" y="469" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">q：每个实例的特征向量</text>
<text x="1515.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#203047">保留原分类分支</text>
