<text x="800.0" y="1195" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233348">当前 E1：前一 decoder 层 + GT 形成选区 → 监督最后一层掩码</text>
