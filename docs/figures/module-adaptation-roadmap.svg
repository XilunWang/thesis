<text x="800" y="1330" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#233348">统一规则：官方 3937 / 691 划分及重复图保留 · 同源预训练、预算和评价 · 不挑 best</text>
<text x="800" y="1372" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#9b4624">本次仅确认路线和更新文档，不启动训练。</text>
